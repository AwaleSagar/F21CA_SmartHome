# This repository is an archived 2020 coursework project. Its pinned
# requirements describe the environment the coursework was marked in, so
# dependency bumps are not wanted here.
#
# `open-pull-requests-limit: 0` switches off Dependabot *version update* PRs
# for each manifest below.
#
# NOTE: it does NOT switch off Dependabot *security* update PRs. Those are
# controlled per repository under
#   Settings -> Code security -> Dependabot -> Dependabot security updates
# and must be disabled there if you do not want them re-raised.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/SmartHome_Cacty"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/SmartHome_Cacty/Lab1/sample_bot"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/SmartHome_Cacty/Lab1/sample_bot/calendarEvents"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
